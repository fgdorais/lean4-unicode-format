name = "UnicodeFormat"
version = "0.1.0"
description = "Unicode encoding forms for Lean 4"
keywords = ["unicode"]
defaultTargets = ["UnicodeFormat", "UnicodeFormatTest"]
testDriver = "UnicodeFormatTest"

[[lean_lib]]
name = "UnicodeFormat"

[[lean_lib]]
name = "UnicodeFormatTest"
precompileModules = true

[[require]]
name = "lean4-scalar-arrays"
git = "https://github.com/fgdorais/lean4-scalar-arrays"
rev = "main"
